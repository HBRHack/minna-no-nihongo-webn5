# Konfigurasi Netlify — Studio Lengkap Minna no Nihongo I (Bab 1–25)
# Static site murni (tanpa build bundler), seluruh aplikasi ada di folder `web/`.

[build]
  publish = "01-minna-no-nihongo-n5/web"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
